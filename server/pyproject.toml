[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: style, F: bugs like unused imports, I: import order, B: common pitfalls, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make the alembic library look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `param = Depends(...)` default is the intended DI pattern, not a bug.
extend-immutable-calls = ["fastapi.Depends"]
